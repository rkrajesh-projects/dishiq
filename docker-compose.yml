version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dishiq_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dishiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dishiq_password}
      POSTGRES_DB: ${POSTGRES_DB:-dishiq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dishiq_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DishIQ
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dishiq_user}:${POSTGRES_PASSWORD:-dishiq_password}@postgres:5432/${POSTGRES_DB:-dishiq_db}
      - LOG_LEVEL=INFO
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health'); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dishiq_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: dishiq_mcp_server
    stdin_open: true
    tty: true
    environment:
      - DISHIQ_BACKEND_URL=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -qa python /proc/1/cmdline || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
